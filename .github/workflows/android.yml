name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key (optional)
        if: ${{ env.AQ_KEYSTORE_B64 != '' }}
        env:
          AQ_KEYSTORE_B64: ${{ secrets.AQ_KEYSTORE_B64 }}
        run: |
          echo "$AQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "AQ_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          AQ_KEYSTORE_PASSWORD: ${{ secrets.AQ_KEYSTORE_PASSWORD }}
          AQ_KEY_ALIAS: ${{ secrets.AQ_KEY_ALIAS }}
          AQ_KEY_PASSWORD: ${{ secrets.AQ_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ArticleQuotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArticleQuotes-apk
          path: ArticleQuotes.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Article Quotes (latest build)
          body: "Install this APK on your phone. Each push to main replaces it."
          files: ArticleQuotes.apk
